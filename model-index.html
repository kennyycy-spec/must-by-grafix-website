<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Model Index — MUST by GRAFIX</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><style>:root{--ink:#171717;--paper:#f7f7f5;--stone:#ededea;--muted:#77756f;--line:#d9d4cb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}.shell{max-width:1440px;margin:auto;padding:0 6.5vw}.mast{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:18px;font-weight:600;letter-spacing:.13em;text-decoration:none;color:inherit}.brand span{font-size:10px;font-weight:400;letter-spacing:.05em}.nav{display:flex;gap:22px;font-size:11px;letter-spacing:.12em}.nav a{color:inherit;text-decoration:none}.hero{padding:82px 0 50px;border-bottom:1px solid var(--line)}.hero.with-art{display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,.72fr);gap:clamp(34px,5vw,76px);align-items:center}.hero-art{display:none;margin:0;min-height:340px;background:var(--stone);overflow:hidden}.hero.with-art .hero-art{display:block}.hero-art img{display:block;width:100%;height:100%;object-fit:cover}.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--muted)}h1{font:500 clamp(56px,8vw,108px)/.9 'Playfair Display',serif;letter-spacing:-.055em;margin:18px 0}.hero p{max-width:430px;margin:0;color:var(--muted);line-height:1.6}.collection-features{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-bottom:1px solid var(--line)}.collection-features.is-active{display:grid}.collection-feature{padding:24px 25px 28px 0;border-right:1px solid var(--line)}.collection-feature+.collection-feature{padding-left:25px}.collection-feature:last-child{border-right:0}.collection-feature strong{display:block;font:500 28px/1.05 'Playfair Display',serif;letter-spacing:-.03em;margin-bottom:8px}.collection-feature span{display:block;max-width:25ch;color:var(--muted);font-size:12px;line-height:1.55}.models{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line);margin:60px 0 90px}.model{display:grid;grid-template-columns:175px 1fr;align-items:center;gap:28px;min-height:220px;padding:24px 0;border-bottom:1px solid var(--line)}.model:nth-child(odd){border-right:1px solid var(--line);padding-right:36px}.model:nth-child(even){padding-left:36px}.photo{aspect-ratio:1;background:var(--stone);display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain;padding:8%}.photo .pending{font-size:10px;letter-spacing:.12em;color:var(--muted);text-align:center;padding:20px}.model h2{font:500 30px/1 'Playfair Display',serif;letter-spacing:-.03em;margin:0 0 12px}.model p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}.footer{border-top:1px solid var(--line);padding:30px 0 44px;color:var(--muted);font-size:11px;letter-spacing:.1em}@media(max-width:800px){.shell{padding:0 22px}.mast{height:74px}.nav{font-size:9px;gap:13px}.nav a:nth-child(2){display:none}.hero{padding:62px 0 38px}.hero.with-art{display:block}.hero.with-art .hero-art{height:320px;min-height:0;margin-top:28px}.models{grid-template-columns:1fr;margin:42px 0 60px}.model,.model:nth-child(odd),.model:nth-child(even){grid-template-columns:120px 1fr;min-height:160px;gap:18px;padding:20px 0;border-right:0}.model h2{font-size:24px}.collection-features{grid-template-columns:1fr}.collection-feature,.collection-feature+.collection-feature{padding:18px 0;border-right:0;border-bottom:1px solid var(--line)}.collection-feature:last-child{border-bottom:0}.collection-feature strong{font-size:25px}}</style></head><body><main class="shell"><header class="mast"><a href="index.html" class="logo-lockup" aria-label="MUST by GRAFIX home"><img src="assets/brand/must-by-grafix-logo.png" alt="MUST by GRAFIX · Handmade in Germany" style="display:block;width:clamp(110px,12vw,150px);height:auto"></a><nav class="nav"><a href="index.html">HOME</a><a href="index.html#collection">COLLECTIONS</a><a href="galaxius.html">GALAXIUS</a></nav></header><section id="collection-hero" class="hero"><div class="hero-copy"><div class="eyebrow">COLLECTIONS / <span id="crumb"></span></div><h1 id="title"></h1><p id="intro"></p></div><figure id="collection-hero-art" class="hero-art"><img src="" alt=""></figure></section><section id="collection-features" class="collection-features" aria-label="Collection highlights"></section><section id="models" class="models"></section><footer class="footer">MUST BY GRAFIX / HANDMADE IN GERMANY</footer></main><script>const data={Blackjack:{intro:'A focused collection of character-led acetate frames.',models:[['6680','assets/photos/6680/front.jpg'],['6682','assets/photos/6682/33/front.jpg'],['6683','assets/photos/6683/22/front.jpg'],['6684','assets/photos/6684/22/front.jpg'],['6686','assets/photos/6686_e.jpg'],['6688','assets/photos/6688/33/front.jpg'],['6689','assets/photos/6689/21/front.jpg'],['9914','assets/photos/9914/21/front.jpg'],['9981','assets/photos/9981/22/front.jpg'],['9982','assets/photos/9982/22/front.jpg'],['9983','assets/photos/9983/22/front.jpg']]},'K-Ti':{intro:'A study in compact titanium profiles and precise colour.',models:[['882','assets/photos/K-Ti/882/A2/front.jpg'],['883','assets/photos/K-Ti/883/A3/front.jpg'],['884','assets/photos/K-Ti/884/A4/front.jpg'],['885','assets/photos/K-Ti/885/A51/front.jpg'],['888','assets/photos/K-Ti/888/A5/front.jpg'],['889','assets/photos/K-Ti/889/A11/front.jpg']]},'RT-00':{intro:'Uncoated raw titanium frames, shaped around the natural character of the material.',models:['RT6630','RT6631','RT6632','RT6633','RT6634','RT6635','RT6636','RT6637','RT6500','RT6686','RT6689','RT9981','WIND-01','WIND-02','WIND-03','WIND-04','WIND-05','WIND-06','FIRE-01','FIRE-02','FIRE-03','FIRE-04','FIRE-05','FIRE-06','WATER-01','WATER-02','WATER-03','WATER-04','WATER-05','WATER-06','EARTH-01','EARTH-02','EARTH-03','EARTH-04','EARTH-05','EARTH-06'].map(x=>[x,null])}};const c=new URLSearchParams(location.search).get('collection');if(c==='K-Ti'||c==='K‑Ti')location.replace('kti.html');const current=data[c]||data.Blackjack;const collectionFeatures=document.getElementById('collection-features');const collectionHero=document.getElementById('collection-hero');const collectionHeroArt=document.getElementById('collection-hero-art');const collectionHeroImage=collectionHeroArt.querySelector('img');document.title=`${c||'Blackjack'} — MUST by GRAFIX`;title.textContent=c||'Blackjack';crumb.textContent=c||'Blackjack';intro.textContent=current.intro;if(c==='RT-00'){collectionHero.classList.add('with-art');collectionHeroImage.src='assets/collections/rt-00-wind04.jpg';collectionHeroImage.alt='RT-WIND04 raw titanium frame';const highlights=[['Raw titanium','No surface coating: the material is left in its original colour and finish.'],['Four elements','Wind, Earth, Fire and Water shape four distinct frame expressions.'],['5–10 g','A light, elemental collection with a clear material presence.']];collectionFeatures.innerHTML=highlights.map(([title,copy])=>`<article class="collection-feature"><strong>${title}</strong><span>${copy}</span></article>`).join('');collectionFeatures.classList.add('is-active')}models.innerHTML=current.models.map(([name,img])=>`<article class="model"><div class="photo">${img?`<img src="${img}" alt="${name} eyewear">`:'<span class="pending">OFFICIAL IMAGERY<br>IN PREPARATION</span>'}</div><div><h2>${name}</h2><p>${img?'Explore this model and its available colour expressions.':'Model information will be published with the official imagery.'}</p></div></article>`).join('');</script></body></html>

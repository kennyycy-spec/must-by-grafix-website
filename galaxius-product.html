':'Champagner','18':'Gold','30':'Cherry','31':'Bordeaux','34':'Navy','35':'Khaki','36':'Berry','37':'Chocolate','73':'Army green'};const P={alya:{n:'ALYA',d:'Softly rounded. Quietly distinctive.',hero:'01'},chara:{n:'CHARA',d:'Bold proportions. Refined balance.',s:'48-20-38',hero:'01'},chason:{n:'CHASON',d:'Clean geometry. Clear character.',s:'56-16-33',hero:'34'},dalim:{n:'DALIM',d:'Soft curves. Sculpted presence.',s:'50-20-43',hero:'35'},dione:{n:'DIONE',d:'Compact form. Strong expression.',hero:'03'},diya:{n:'DIYA',d:'Lifted lines. Effortless confidence.',s:'47-19-41',hero:'06'},helene:{n:'HELENE',d:'Quiet geometry. Defined elegance.',s:'53-18-46',hero:'03'},sinope:{n:'SINOPE',d:'Strong lines. Immediate impact.',s:'53-18-36',hero:'05'},thebe:{n:'THEBE',d:'A distinctive bridge. A considered profile.',s:'48-21-44',hero:'34'}};const key=new URLSearchParams(location.search).get('model'),p=P[key]||P.alya,base=`assets/photos/galaxius/${key||'alya'}`;document.title=`${p.n} — MUST by GRAFIX`;title.textContent=crumb.textContent=eyebrow.textContent=p.n;description.textContent=p.d;size.textContent='';specs.innerHTML=`<div><strong>MODEL</strong> ${p.n}</div><div><strong>SIZE</strong> ${p.s||'—'}</div><div><strong>COLLECTION</strong> GALAXIUS</div>`;const heroFiles=[['close',`${key||'alya'}_${p.hero}close.png`],['open front',`${key||'alya'}_${p.hero}openfront.png`],['open side',`${key||'alya'}_${p.hero}openside.png`]];heroes.innerHTML=heroFiles.map(([label,file])=>`<figure><img src="${base}/${file}" alt="${p.n} ${label} view"><figcaption class="caption">${label.toUpperCase()}</figcaption></figure>`).join('');const all=[...Object.keys(N).map(c=>[c,N[c]])].sort((a,b)=>Number(a[0])-Number(b[0]));const available=all.filter(([c,n])=>{const file=`${key||'alya'}_${c}_${n.toLowerCase().replace(' ','-')}.png`;return true}).map(([c,n])=>[c,n,`${key||'alya'}_${c}_${n.toLowerCase().replace(' ','-')}.png`]);variations.innerHTML=available.map(([c,n,f],i)=>`<button class="variation" data-i=

<style>
:root{--ink:#171717;--paper:#f7f7f5;--stone:#ededea;--muted:#77756f;--line:#d9d4cb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}.shell{max-width:1440px;margin:auto;padding:0 6.5vw}.mast{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand,.nav a,.model{color:inherit;text-decoration:none}.brand{font-size:18px;font-weight:600;letter-spacing:.13em}.brand span{font-size:10px;font-weight:400;letter-spacing:.05em}.nav{display:flex;gap:22px;font-size:11px;letter-spacing:.12em}.hero{display:grid;grid-template-columns:1.08fr .92fr;min-height:480px;border-bottom:1px solid var(--line)}.hero-copy{padding:94px 6vw 76px 0;display:flex;flex-direction:column;justify-content:end}.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--muted)}h1{font:500 clamp(56px,8vw,110px)/.9 'Playfair Display',serif;letter-spacing:-.055em;margin:18px 0 26px}.hero p{max-width:390px;margin:0;color:#4c4b48;line-height:1.65}.collection-art{margin:42px 0;background:var(--stone);display:grid;place-items:center;overflow:hidden}.collection-art img{width:100%;height:100%;object-fit:contain;padding:7%;background:var(--stone)}.models{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:54px 0 92px;border-top:1px solid var(--line)}.model{display:grid;grid-template-columns:170px 1fr;gap:28px;align-items:center;min-height:230px;padding:24px 0;border-bottom:1px solid var(--line)}.model:nth-child(odd){border-right:1px solid var(--line);padding-right:36px}.model:nth-child(even){padding-left:36px}.photo{aspect-ratio:1;background:var(--stone);display:grid;place-items:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain;padding:8%;transition:transform .25s}.model:hover img{transform:scale(1.03)}.pending{font-size:9px;color:var(--muted);letter-spacing:.12em;text-align:center;line-height:1.7}.model h2{font:500 27px/1 'Playfair Display',se
